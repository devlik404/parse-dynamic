apiVersion: apps/v1
kind: Deployment
metadata:
  name: universal-parser-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: universal-parser-api
  template:
    metadata:
      labels:
        app: universal-parser-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: parser-api
          image: parser-job:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: universal-parser-api-config
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: universal-parser-api
spec:
  selector:
    app: universal-parser-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: universal-parser-api-config
data:
  APP_MODE: HTTP
  HTTP_ADDR: ":8080"
  # Same HTTP object-gateway contract as cashrecon-sch-parse-file-atm-bersama.
  MINIO_BASE_URL: http://sch-minio.reopsc:8080
  MINIO_BUCKET_NAME: rsp-reopsc
  MINIO_HTTP_TIMEOUT: 5m
  # Set this to the scheduler's common root when one is available.
  MINIO_PATH_PREFIX: ""
  # Reference-compatible behind the NetworkPolicy. For additional defense,
  # set true and inject PREVIEW_BEARER_TOKEN from an externally managed Secret.
  PREVIEW_REQUIRE_AUTH: "false"
  PREVIEW_DEFAULT_LIMIT: "20"
  PREVIEW_MAX_LIMIT: "100"
  PREVIEW_MAX_INPUT_BYTES: "67108864"
  PREVIEW_MAX_REQUEST_BYTES: "16384"
  PREVIEW_MAX_RESPONSE_BYTES: "2097152"
  PREVIEW_MAX_VALUE_BYTES: "1024"
  PREVIEW_REQUEST_TIMEOUT: 30s
  PREVIEW_MAX_CONCURRENCY: "4"
  HTTP_READ_HEADER_TIMEOUT: 5s
  HTTP_READ_TIMEOUT: 30s
  HTTP_WRITE_TIMEOUT: 60s
  HTTP_IDLE_TIMEOUT: 60s
  HTTP_SHUTDOWN_TIMEOUT: 10s
  INPUT_SKIP_EMPTY_LINE: "true"
  PARSER_FILE_TYPE: SECTIONED_DELIMITED
  PARSER_DELIMITER: "|"
  PARSER_HAS_HEADER: "false"
  PARSER_COLUMNS: record_type,section_key,payload
  PARSER_TYPES: string,string,json
  PARSER_MAPPING: record_type:record_type,section_key:section_key,payload:payload
  PARSER_RECORD_TYPE_INDEX: "0"
  PARSER_SECTION_KEY_INDEX: "1"
  PARSER_FILE_HEADER_CODE: RH
  PARSER_SECTION_HEADER_CODE: SH
  PARSER_DATA_CODE: SB
  PARSER_SECTION_FOOTER_CODE: SF
  PARSER_FILE_FOOTER_CODE: RF
  PARSER_DYNAMIC_HEADER_START_INDEX: "2"
  PARSER_DATA_START_INDEX: "2"
  PARSER_DUPLICATE_HEADER_POLICY: SUFFIX_INDEX
  PARSER_TRIM_SPACE: "true"
  PARSER_NULL_IF_EMPTY: "true"
  PARSER_ALLOW_EXTRA_COLUMNS: "false"
  PARSER_MAX_RECORD_BYTES: "1048576"
  PARSER_MAX_FIELDS: "10000"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: universal-parser-api-ingress
spec:
  podSelector:
    matchLabels:
      app: universal-parser-api
  policyTypes:
    - Ingress
  ingress:
    # Only explicitly trusted callers in this namespace may reach the API.
    # Apply this label to the internal gateway or workload that calls it.
    - from:
        - podSelector:
            matchLabels:
              access-universal-parser-api: "true"
      ports:
        - protocol: TCP
          port: 8080
